.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 40px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1,h2{font-family:inherit;margin:0;text-shadow:0 2px 6px rgba(0,0,0,.8)}
h1{font-size:clamp(26px,5vw,42px);font-weight:800}
.lead{max-width:66ch;margin:6px 0 18px;text-shadow:0 1px 4px rgba(0,0,0,.9)}
#lb{background:rgba(0,0,0,.6);color:#fff;border:1px solid var(--ac);padding:8px 16px;border-radius:8px;cursor:pointer;font:inherit;font-weight:700;white-space:nowrap}
#lb:hover{background:var(--ac);color:#000}
.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel,.rot,.base,.note{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:16px;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.panel h2{font-size:18px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px;font-weight:700}
select,input[type=number],input[type=text]{width:100%;padding:7px 8px;border:1px solid var(--ln);border-radius:6px;background:var(--in);color:var(--tx);font:inherit}
input[type=number]{direction:ltr}
html[dir=rtl] input[type=number]{text-align:right}
select option{background:#222;color:#fff}
select:focus,input:focus{outline:2px solid var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac);direction:ltr}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sl{display:flex;justify-content:space-between;font-size:13px;margin-top:8px}.sl b{font-weight:700}
.rot{margin-bottom:14px}
.rot:first-of-type{border-color:var(--ac);border-width:2px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.big{font-weight:800;font-size:30px;color:var(--ac)}
.big small{font-size:14px;color:var(--mu);font-weight:500}
.seq{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.yr{border:1px solid var(--ln);border-radius:8px;padding:8px 10px;background:rgba(0,0,0,.3)}
.yr small{color:var(--mu);display:block}.yr strong{font-size:15px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;margin:4px 0 0;margin-inline-end:4px;border:1px solid currentColor;font-weight:700}
.ok{color:var(--ok)}.warn{color:var(--w)}.bad{color:var(--bad)}
.bars{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;margin:8px 0}
.bar{font-size:12.5px;color:var(--mu)}.bar i{display:block;height:7px;border-radius:4px;background:rgba(255,255,255,.14);margin-top:3px;overflow:hidden}.bar i s{display:block;height:100%;background:var(--ac)}
.why{margin:8px 0 0;font-size:14px}
.base{margin:0 0 12px}
.note{font-size:12.5px;color:var(--mu);margin-top:14px;line-height:1.7}
@media(max-width:520px){.seq,.bars{grid-template-columns:1fr}}
</style></head><body>
<div id="bg"></div>
<div class="wrap">
<div class="hd"><h1 data-ar="بوصلة الدورة الزراعية" data-en="Rotation Compass"></h1><button id="lb" type="button">🌐 English</button></div>
<p class="lead" data-ar="قارن خيارات الدورة الزراعية على ثلاث سنوات مع المناخ المتوقع لمزرعتك. اكتب أرقام المناخ والتربة الخاصة بمزرعتك وأولوياتك، لترى أي التسلسلات هي الأفضل." data-en="Compare three-year crop rotations against the climate your farm is heading into. Enter your own climate and soil figures and your priorities, and see which sequences hold up."></p>
<div class="grid">
<div class="panel">
<h2 data-ar="بيانات مزرعتك" data-en="Your farm"></h2>
<label for="reg" data-ar="المنطقة" data-en="Region"></label><input type="text" id="reg">
<div class="row"><div><label for="rain" data-ar="الأمطار السنوية (مم)" data-en="Annual rain, mm"></label><input type="number" id="rain"></div><div><label for="temp" data-ar="متوسط حرارة الموسم (°م)" data-en="Season mean temp, °C"></label><input type="number" id="temp" step=".5"></div></div>
<div class="row"><div><label for="warm" data-ar="الاحترار (°م/عقد)" data-en="Warming, °C/decade"></label><input type="number" id="warm" step=".05"></div><div><label for="rc" data-ar="تغير الأمطار (%/عقد)" data-en="Rain change, %/decade"></label><input type="number" id="rc" step="1"></div></div>
<div class="row"><div><label for="tex" data-ar="نوع التربة" data-en="Soil texture"></label><select id="tex"><option value="sand" data-ar="رملية" data-en="Sandy"></option><option value="loam" selected data-ar="طميية" data-en="Loam"></option><option value="clay" data-ar="طينية" data-en="Clay"></option></select></div>
<div><label for="irr" data-ar="الري التكميلي (مم/سنة)" data-en="Supplemental irrigation, mm/yr"></label><input type="number" id="irr" min="0" step="10"></div></div>
<div class="row"><div><label for="om" data-ar="المادة العضوية (%)" data-en="Organic matter, %"></label><input type="number" id="om" step=".1" min="0"></div><div><label for="hor" data-ar="التخطيط لمدة (سنة)" data-en="Look ahead, years"></label><input type="number" id="hor" min="1" max="50" value="20"></div></div>
<label for="cur" data-ar="آخر محصول زُرع" data-en="Last crop grown"></label><select id="cur"></select>
<h2 style="margin-top:18px" data-ar="الأهم بالنسبة لك" data-en="What matters most"></h2>
<div class="sl"><b data-ar="توفير المياه" data-en="Save water"></b><span id="v_w"></span></div><input type="range" id="p_w" min="0" max="10" value="6">
<div class="sl"><b data-ar="بناء صحة التربة" data-en="Build soil health"></b><span id="v_s"></span></div><input type="range" id="p_s" min="0" max="10" value="7">
<div class="sl"><b data-ar="الدخل" data-en="Income"></b><span id="v_i"></span></div><input type="range" id="p_i" min="0" max="10" value="5">
<div class="sl"><b data-ar="المرونة المناخية" data-en="Climate resilience"></b><span id="v_r"></span></div><input type="range" id="p_r" min="0" max="10" value="7">
</div>
<div><div id="out"></div>
<p class="note" data-ar="اكتب أرقام موقعك بنفسك (يمكن الحصول عليها مثلًا من power.larc.nasa.gov). خصائص المحاصيل متوسطات مبسطة، فاعتبر النتائج وسيلة للمقارنة وراجع مهندسًا زراعيًا محليًا." data-en="Enter your own location’s figures (for example from power.larc.nasa.gov). Crop traits are simplified averages. Treat results as a way to compare options, and confirm with a local agronomist."></p></div>
</div></div>
<script>
let L="ar";try{L=localStorage.getItem("rc-lang")||"ar"}catch(e){}
const C=[{n:"Wheat",a:"قمح",f:"Grass",w:450,h:5,d:6,nf:0,c:7,i:5},{n:"Maize",a:"ذرة شامية",f:"Grass",w:600,h:6,d:4,nf:0,c:8,i:7},{n:"Sorghum",a:"ذرة رفيعة",f:"Grass",w:350,h:9,d:9,nf:0,c:7,i:4},{n:"Soybean",a:"فول صويا",f:"Legume",w:500,h:6,d:5,nf:60,c:4,i:7},{n:"Chickpea",a:"حمص",f:"Legume",w:300,h:5,d:7,nf:40,c:4,i:6},{n:"Cowpea",a:"لوبيا",f:"Legume",w:350,h:9,d:8,nf:50,c:4,i:5},{n:"Sunflower",a:"عباد الشمس",f:"Daisy",w:400,h:7,d:8,nf:0,c:6,i:6},{n:"Canola",a:"كانولا",f:"Brassica",w:400,h:4,d:5,nf:0,c:5,i:6},{n:"Potato/vegetables",a:"بطاطس/خضروات",f:"Nightshade",w:500,h:5,d:3,nf:0,c:2,i:9},{n:"Cover crop mix",a:"خليط محاصيل تغطية",f:"Mixed",w:250,h:6,d:7,nf:40,c:9,i:1,cov:1}];
const $=id=>document.getElementById(id),x=(e,a)=>L=="ar"?a:e,nm=c=>x(c.n,c.a);
function fill(){const cv=$("cur").value;$("cur").innerHTML=C.map((c,i)=>`<option value="${i}">${nm(c)}</option>`).join("");if(cv)$("cur").value=cv;}
function lang(){document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
 document.querySelectorAll("[data-en]").forEach(e=>e.textContent=e.dataset[L]);
 $("lb").textContent=L=="ar"?"🌐 English":"🌐 العربية";
 document.title=x("Rotation Compass: crop rotation planner","بوصلة الدورة الزراعية");fill();}
const cl=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
function env(){const g=k=>+$(k).value,dec=(g("hor")||20)/10,tx=$("tex").value;
 return{dec,sup:(g("rain")*.6*(1+g("rc")/100*dec))*(tx=="sand"?.85:tx=="clay"?.95:1)+g("irr"),T:g("temp")+g("warm")*dec,om:g("om"),tx};}
function crop(c,E){let def=Math.max(0,(c.w-E.sup)/c.w)*(1-.06*c.d);def=cl(def*1.3,0,1);
 const hs=cl(Math.max(0,E.T-(22+c.h*1.2))/5,0,1);return{def,hs};}
function score(s,E){const cs=s.map(i=>C[i]),n=3,m=k=>cs.reduce((a,c)=>a+c[k],0)/n;
 const st=cs.map(c=>crop(c,E)),mdef=st.reduce((a,v)=>a+v.def,0)/n,mhs=st.reduce((a,v)=>a+v.hs,0)/n;
 const div=new Set(cs.map(c=>c.f)).size/3,Ns=cs.reduce((a,c)=>a+c.nf,0),cov=cs.some(c=>c.cov)?1:0;
 const water=100*(.6*(1-mdef)+.4*(1-cl(m("w")/700,0,1)));
 const lowOM=cl((2.5-E.om)/2,0,1),ero=E.tx=="sand"?.15:.05;
 const soil=cl(100*(.35*m("c")/10+.25*cl(Ns/60)+.15*div+.15*cov+.1*(1-lowOM)*m("c")/10+ero*cov*3),0,100);
 const inc=100*(m("i")/9)*(1-.35*mdef)+8*cl(Ns/60);
 const res=cl(70*(.5*(1-mhs)+.5*m("d")/10)+30*div,0,100);
 return{water,soil,inc:cl(inc),res,heat:mhs,def:mdef,st,Ns,cov,div};}
function total(r,P){const t=P.w+P.s+P.i+P.r||1;return(P.w*r.water+P.s*r.soil+P.i*r.inc+P.r*r.res)/t;}
function run(){
 ["w","s","i","r"].forEach(k=>$("v_"+k).textContent=$("p_"+k).value+"/10");
 if(!$("rain").value||!$("temp").value){$("out").innerHTML="<p class=\"base\">"+x("Enter your annual rain and season mean temperature to see results.","اكتب الأمطار السنوية ومتوسط حرارة الموسم لتظهر النتائج.")+"</p>";return;}
 const E=env(),P={w:+$("p_w").value,s:+$("p_s").value,i:+$("p_i").value,r:+$("p_r").value},cur=C[+$("cur").value],all=[],idx=C.map((_,i)=>i);
 for(const a of idx)for(const b of idx)for(const c of idx){const s=[a,b,c],cs=s.map(i=>C[i]);
  if(cs[0].f==cur.f&&cur.f!="Mixed")continue;
  if(cs.some((v,i)=>v.f==cs[(i+1)%3].f&&v.f!="Mixed"))continue;
  if(cs.filter(v=>v.cov).length>1||!cs.some(v=>v.nf))continue;
  const r=score(s,E);all.push({s,r,t:total(r,P)});}
 all.sort((p,q)=>q.t-p.t);
 const base=score([+$("cur").value,+$("cur").value,+$("cur").value],E),bt=total(base,P),H=+$("hor").value||20;
 let h=`<p class="base">${x(`Growing ${cur.n} every year scores <b>${bt.toFixed(0)}</b> for your priorities. Best rotations by projected conditions in ${H} years (${E.T.toFixed(1)} °C season mean, ${E.sup.toFixed(0)} mm usable water):`,`زراعة ${cur.a} كل سنة تحصل على <b>${bt.toFixed(0)}</b> حسب أولوياتك. أفضل الدورات بحسب الظروف المتوقعة بعد ${H} سنة (متوسط حرارة الموسم ${E.T.toFixed(1)} °م، والمياه المتاحة ${E.sup.toFixed(0)} مم):`)}</p>`;
 const pick=[];for(const o of all){if(pick.length>=3)break;if(pick.every(q=>q.s.filter(i=>o.s.includes(i)).length<2))pick.push(o);}for(const o of all){if(pick.length>=3)break;if(!pick.includes(o))pick.push(o);}
 pick.forEach((o,k)=>{const r=o.r,d=o.t-bt;
  h+=`<div class="rot"><div class="top"><h2>${x("Option ","الخيار ")}${k+1}</h2><span class="big">${o.t.toFixed(0)}<small> / 100 (${d>=0?"+":""}${d.toFixed(0)} ${x("vs monoculture","مقارنة بمحصول واحد")})</small></span></div><div class="seq">`;
  o.s.forEach((i,y)=>{const c=C[i],v=r.st[y],p=(v.def*100).toFixed(0);
   const wc=v.def<.1?["ok",x("water met","المياه كافية")]:v.def<.35?["warn",x("water gap ","نقص مياه ")+p+"%"]:["bad",x("water short ","مياه قليلة ")+p+"%"];
   const hc=v.hs<.05?["ok",x("heat ok","الحرارة مناسبة")]:v.hs<.4?["warn",x("heat stress","إجهاد حراري")]:["bad",x("high heat risk","خطر حرارة عالٍ")];
   h+=`<div class="yr"><small>${x("Year ","السنة ")}${y+1}</small><strong>${nm(c)}</strong><br><span class="chip ${wc[0]}">${wc[1]}</span><span class="chip ${hc[0]}">${hc[1]}</span></div>`;});
  h+=`</div><div class="bars">${[[x("Water","المياه"),r.water],[x("Soil health","صحة التربة"),r.soil],[x("Income","الدخل"),r.inc],[x("Resilience","المرونة"),r.res]].map(([l,v])=>`<div class="bar">${l} ${v.toFixed(0)}<i><s style="width:${v}%"></s></i></div>`).join("")}</div>`;
  const best=[[x("water saving","توفير المياه"),r.water],[x("soil building","بناء التربة"),r.soil],[x("income","الدخل"),r.inc],[x("resilience","المرونة"),r.res]].sort((a,b)=>b[1]-a[1])[0][0];
  h+=`<p class="why">${x(`Strongest on ${best}. Legumes and cover crops return about ${r.Ns} kg N/ha over the cycle${r.cov?", and the cover crop protects bare soil":""}${E.om<2?". Your low organic matter makes residue and cover especially valuable":""}${r.def>.3?". Water is tight, so consider supplemental irrigation or earlier sowing":""}.`,`الأقوى في ${best}. البقوليات ومحاصيل التغطية تضيف نحو ${r.Ns} كجم نيتروجين/هكتار خلال الدورة${r.cov?"، ومحصول التغطية يحمي التربة العارية":""}${E.om<2?". مادتك العضوية قليلة، فبقايا المحاصيل والتغطية مفيدة جدًا لك":""}${r.def>.3?". المياه شحيحة، ففكر في ري تكميلي أو زراعة مبكرة":""}.`)}</p></div>`;});
 if(!all.length)h="<p>"+x("No valid rotations for these settings.","لا توجد دورات مناسبة لهذه الإعدادات.")+"</p>";
 $("out").innerHTML=h;}
$("lb").onclick=()=>{L=L=="ar"?"en":"ar";try{localStorage.setItem("rc-lang",L)}catch(e){}lang();run()};
document.querySelectorAll("input,select").forEach(e=>{if(e.id!="reg")e.addEventListener("input",run);e.addEventListener("change",run)});
lang();run();
</script></body></html>
